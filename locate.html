<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayson the Achieve - Locate</title>
    <link rel="preconnect" href="https://googleapis.com"><link rel="preconnect" href="https://gstatic.com" crossorigin><link href="https://googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --matrix-green: #00ff41; --dark-green: #003b00; --terminal-bg: #0d0d0d; --panel-bg: rgba(16, 28, 16, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body, html { background-color: var(--terminal-bg); color: var(--matrix-green); min-height: 100vh; display: flex; flex-direction: column; }
        header { border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 15px; margin: 20px; text-align: center; }
        .page-panel { width: 100%; max-width: 900px; border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 25px; margin: 0 auto; }
        .guide-box { background: rgba(0, 39, 0, 0.3); border: 1px dashed var(--matrix-green); padding: 15px; margin-bottom: 25px; }
        .terminal-input { width: 100%; background: #000; border: 1px solid var(--matrix-green); padding: 10px; color: var(--matrix-green); margin-bottom: 20px; }
        .terminal-btn { width: 100%; background: var(--dark-green); color: var(--matrix-green); border: 2px solid var(--matrix-green); padding: 12px; cursor: pointer; text-decoration: none; display: block; text-align: center; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 2rem;">[ JAYSON THE ACHIEVE GEOLOCATION ]</div>
        <nav style="display:flex; justify-content:center; gap:20px; margin-top:15px;">
            <a href="./chat.html" style="color:var(--matrix-green); text-decoration:none; border:1px solid; padding:5px 15px;">HOME</a>
            <a href="./locate.html" style="color:var(--matrix-green); text-decoration:none; border:1px solid; padding:5px 15px;">LOCATE</a>
        </nav>
    </header>
    <main style="padding: 20px;">
        <div class="page-panel">
            <div class="guide-box">
                <strong>INSTRUCTIONS:</strong>
                <ol style="margin-left: 20px; line-height: 1.6;">
                    <li>Open <strong>Google Maps</strong>.</li>
                    <li>Drop a pin or find your target spot.</li>
                    <li>Tap <strong>Share</strong> and select <strong>Copy Link</strong>.</li>
                    <li>Paste the link below to initialize the radar.</li>
                </ol>
            </div>
            <label>PASTE MAP URL:</label>
            <input type="text" id="url" class="terminal-input" placeholder="https://goo.gl..." oninput="check()">
            <a id="lnk" class="terminal-btn" style="opacity:0.4; pointer-events:none;" target="_blank">LAUNCH SATELLITE RADAR</a>
        </div>
    </main>
    <script>
        function check() {
            const v = document.getElementById('url').value; const btn = document.getElementById('lnk');
            if(v.includes('maps') || v.includes('goo.gl')) { btn.style.opacity = '1'; btn.style.pointerEvents = 'auto'; btn.href = v; }
            else { btn.style.opacity = '0.4'; btn.style.pointerEvents = 'none'; }
        }
    </script>
</body>
</html>
