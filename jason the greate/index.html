<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayson the Achieve - Home</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --matrix-green: #00ff41;
            --dark-green: #003b00;
            --terminal-bg: #0d0d0d;
            --error-red: #ff3333;
            --panel-bg: rgba(16, 28, 16, 0.9);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body, html { background-color: var(--terminal-bg); color: var(--matrix-green); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px; z-index: 9999; pointer-events: none; opacity: 0.4;
        }
        .matrix-fallback {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: radial-gradient(circle, rgba(0,59,0,0.15) 0%, rgba(13,13,13,1) 100%); z-index: -1;
        }
        header { border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 15px; margin: 20px; text-align: center; box-shadow: 0 0 15px rgba(0, 255, 65, 0.3); }
        .site-title { font-size: 2rem; letter-spacing: 4px; text-shadow: 0 0 10px var(--matrix-green); }
        .nav-bar { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .nav-link { color: var(--matrix-green); border: 1px solid var(--matrix-green); padding: 8px 16px; text-decoration: none; font-size: 1.1rem; transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { background: var(--matrix-green); color: #000; box-shadow: 0 0 10px var(--matrix-green); }
        .main-content { flex: 1; display: flex; justify-content: center; align-items: center; padding: 0 20px; }
        .page-panel { width: 100%; max-width: 900px; border: 2px solid var(--matrix-green); background: var(--panel-bg); box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); padding: 25px; }
        h2 { border-bottom: 1px dashed var(--matrix-green); padding-bottom: 10px; margin-bottom: 20px; font-size: 1.5rem; }
        .terminal-input { width: 100%; background: #000; border: 1px solid var(--matrix-green); padding: 10px; color: var(--matrix-green); font-size: 1.1rem; outline: none; }
        .terminal-btn { width: 100%; background: var(--dark-green); color: var(--matrix-green); border: 2px solid var(--matrix-green); padding: 12px; font-size: 1.2rem; cursor: pointer; transition: all 0.2s ease; }
        .terminal-btn:hover { background: var(--matrix-green); color: #000; box-shadow: 0 0 15px var(--matrix-green); font-weight: bold; }
        footer { margin-top: 30px; border-top: 2px dashed var(--matrix-green); padding: 15px; text-align: center; font-size: 1.1rem; letter-spacing: 2px; background: var(--panel-bg); }
    </style>
    <script>
        // Security gate rule mapping for individual files
        function verifySession() {
            if (localStorage.getItem('jayson_session_active') !== 'true' && !window.location.pathname.includes('login.html')) {
                window.location.href = 'login.html';
            }
        }
        if (!window.location.pathname.includes('login.html')) {
            window.addEventListener('DOMContentLoaded', verifySession);
        }
        function handleLogout() {
            localStorage.removeItem('jayson_session_active');
            localStorage.removeItem('jayson_session_user');
            window.location.href = 'login.html';
        }
    </script>

    <style>
        .chat-area { background: #000; border: 1px solid var(--matrix-green); height: 350px; overflow-y: auto; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { background: rgba(0, 59, 0, 0.4); border-left: 3px solid var(--matrix-green); padding: 8px 12px; max-width: 85%; align-self: flex-start; }
        .msg-bubble.self { align-self: flex-end; border-left: none; border-right: 3px solid var(--matrix-green); background: rgba(0, 100, 0, 0.2); }
        .msg-meta { font-size: 0.8rem; opacity: 0.7; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 20px; }
    </style>
</head>
<body>
    <div class="scanlines"></div>
    <div class="matrix-fallback"></div>
    <header>
        <div class="site-title">[ SYSTEM ACCESS: JAYSON THE ACHIEVE ]</div>
        <nav class="nav-bar">
            <a href="index.html" class="nav-link active">HOME PANEL</a>
            <a href="locate.html" class="nav-link">LOCATE RADAR</a>
            <a href="#" onclick="handleLogout()" class="nav-link" style="border-color:var(--error-red); color:var(--error-red);">DISCONNECT</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="page-panel">
            <h2>// CENTRAL_COMMUNICATION_HUB</h2>
            <div style="margin-bottom: 15px;">TERMINAL IDENTIFIER: <span id="user-display" style="text-decoration: underline;">...</span></div>
            <div class="chat-area" id="msg-viewport"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="msg-input" class="terminal-input" placeholder="Type package message data..." onkeydown="if(event.key==='Enter') sendPackage()">
                <button class="terminal-btn" style="width:120px;" onclick="sendPackage()">SEND</button>
            </div>
        </div>
    </main>
    <footer>SYSTEM DESIGN: Jayson the Achieve &bull; created by Twine Jayson Prince</footer>
    <script>
        document.getElementById('user-display').innerText = (localStorage.getItem('jayson_session_user') || 'ANONYMOUS').toUpperCase();
        
        function getPackets() {
            return JSON.parse(localStorage.getItem('jayson_local_chat') || '[]');
        }
        function sendPackage() {
            const input = document.getElementById('msg-input');
            const txt = input.value.trim();
            if(!txt) return;
            const packets = getPackets();
            packets.push({
                sender: localStorage.getItem('jayson_session_user') || 'unknown',
                body: txt,
                time: new Date().toLocaleTimeString()
            });
            localStorage.setItem('jayson_local_chat', JSON.stringify(packets));
            input.value = '';
            renderPackets();
        }
        function renderPackets() {
            const vp = document.getElementById('msg-viewport');
            const packets = getPackets();
            const me = localStorage.getItem('jayson_session_user');
            vp.innerHTML = '';
            if(packets.length === 0) {
                vp.innerHTML = '<div style="margin:auto; opacity:0.5;">[ NO SECURE TRANSMISSIONS FOUND ]</div>';
                return;
            }
            packets.forEach(p => {
                const d = document.createElement('div');
                const isMe = p.sender === me;
                d.className = 'msg-bubble' + (isMe ? ' self' : '');
                d.innerHTML = `<div class="msg-meta"><span style="color:${isMe?'#00fff0':'var(--matrix-green)'}">${p.sender.toUpperCase()}</span><span>${p.time}</span></div><div style="word-break:break-word;">${escapeHTML(p.body)}</div>`;
                vp.appendChild(d);
            });
            vp.scrollTop = vp.scrollHeight;
        }
        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
        renderPackets();
        setInterval(renderPackets, 2000);
    </script>
</body>
</html>
