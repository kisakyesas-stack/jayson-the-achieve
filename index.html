<!DOCTYPE html>
<html>
<head>
  <title>Jayson the Achieve - Live Chat</title>
</head>
<body>
  <div id="chat-box"></div>
  <input type="text" id="message-input" placeholder="Type a message...">
  <button onclick="sendMessage()">Send</button>

  <!-- Load Firebase libraries directly via CDN -->
  <script src="https://gstatic.com"></script>
  <script src="https://gstatic.com"></script>

  <script>
    // Paste your exact Firebase configuration block here
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_://firebaseapp.com",
      databaseURL: "https://YOUR_://firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_://appspot.com"
    };
    
    // Initialize the real-time cloud data pipeline
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // 1. Listen for new incoming data packets from friends live
    database.ref('global-chat').on('child_added', (snapshot) => {
      const data = snapshot.val();
      const chatBox = document.getElementById('chat-box');
      chatBox.innerHTML += `<p><b>Friend:</b> ${data.message}</p>`;
    });

    // 2. Transmit message instantly to the cloud database when clicking send
    function sendMessage() {
      const input = document.getElementById('message-input');
      if(input.value.trim() !== "") {
        database.ref('global-chat').push({
          message: input.value,
          timestamp: Date.now()
        });
        input.value = "";
      }
    }
  </script>
</body>
</html>
