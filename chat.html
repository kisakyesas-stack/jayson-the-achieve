<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayson the Achieve - Cloud Network Matrix</title>
    <link rel="preconnect" href="https://googleapis.com"><link rel="preconnect" href="https://gstatic.com" crossorigin><link href="https://googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root { --matrix-green: #00ff41; --dark-green: #003b00; --terminal-bg: #0d0d0d; --panel-bg: rgba(16, 28, 16, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body, html { background-color: var(--terminal-bg); color: var(--matrix-green); min-height: 100vh; display: flex; flex-direction: column; }
        header { border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 15px; margin: 20px; text-align: center; }
        .main-content { flex: 1; display: flex; justify-content: center; padding: 0 20px; gap: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .grid-container { display: grid; grid-template-columns: 250px 1fr; width: 100%; border: 2px solid var(--matrix-green); background: var(--panel-bg); min-height: 500px; }
        .channels-sidebar { border-right: 2px solid var(--matrix-green); background: #000; overflow-y: auto; padding: 10px; gap: 5px; display: flex; flex-direction: column; }
        .channel-btn { background: transparent; border: 1px solid transparent; color: var(--matrix-green); padding: 8px; text-align: left; cursor: pointer; font-size: 1rem; width: 100%; }
        .channel-btn.active-node { background: var(--dark-green); border-color: var(--matrix-green); font-weight: bold; }
        .workspace-panel { display: flex; flex-direction: column; padding: 20px; }
        .chat-area { background: #000; border: 1px solid var(--matrix-green); flex: 1; overflow-y: auto; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { background: rgba(0, 59, 0, 0.4); border-left: 3px solid var(--matrix-green); padding: 8px 12px; max-width: 85%; align-self: flex-start; }
        .msg-bubble.self { align-self: flex-end; border-left: none; border-right: 3px solid var(--matrix-green); }
        .msg-bubble.private-payload { border-color: #ff9900; background: rgba(139, 92, 26, 0.15); }
        .terminal-input { width: 100%; background: #000; border: 1px solid var(--matrix-green); padding: 10px; color: var(--matrix-green); }
        .terminal-btn { background: var(--dark-green); color: var(--matrix-green); border: 2px solid var(--matrix-green); padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 2rem;">[ JAYSON THE ACHIEVE CLOUD NETWORK MATRIX ]</div>
        <nav style="display:flex; justify-content:center; gap:20px; margin-top:15px;">
            <a href="./chat.html" style="color:var(--matrix-green); text-decoration:none; border:1px solid; padding:8px 16px;">HOME PANEL</a>
            <a href="./locate.html" style="color:var(--matrix-green); text-decoration:none; border:1px solid; padding:8px 16px;">LOCATE RADAR</a>
            <a href="#" onclick="localStorage.clear(); window.location.href='./index.html';" style="color:var(--error-red); text-decoration:none; border:1px solid; padding:8px 16px;">DISCONNECT</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="grid-container">
            <div class="channels-sidebar">
                <button class="channel-btn active-node" id="target-global" onclick="selectTargetNode('global')">GLOBAL MAIN GRID</button>
                <div id="operator-nodes-stack"></div>
            </div>
            <div class="workspace-panel">
                <div style="margin-bottom:15px; display:flex; justify-content:space-between;">
                    <div>OPERATOR: <span id="u-tag" style="color:#00fff0;"></span></div>
                    <div>ROUTING TO: <span id="target-tag" style="color:#00fff0;">GLOBAL</span></div>
                </div>
                <div class="chat-area" id="box"></div>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="inp" class="terminal-input" placeholder="Inject localized data packet..." onkeydown="if(event.key==='Enter') send()">
                    <button class="terminal-btn" onclick="send()">TRANSMIT</button>
                </div>
            </div>
        </div>
    </main>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAuk5if70H5DGkRuV2vTefUZd4JINxdunE",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "jayson-the-achieve-96582",
            storageBucket: "jayson-the-achieve-96582.firebasestorage.app",
            messagingSenderId: "682004007077",
            appId: "1:682004007077:web:65422df8a73802ec33a54c"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const me = localStorage.getItem('jayson_session_user') || 'ANON';
        document.getElementById('u-tag').innerText = me.toUpperCase();
        let currentTarget = 'global';

        for(let i=1; i<=20; i++) {
            const nodeID = 'operator' + (i < 10 ? '0' + i : i);
            if(nodeID === me) continue;
            const btn = document.createElement('button');
            btn.className = 'channel-btn';
            btn.id = `target-${nodeID}`;
            btn.innerText = `[⚡] ${nodeID.toUpperCase()}`;
            btn.onclick = () => selectTargetNode(nodeID);
            document.getElementById('operator-nodes-stack').appendChild(btn);
        }

        function selectTargetNode(nodeID) {
            currentTarget = nodeID;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active-node'));
            document.getElementById(nodeID === 'global' ? 'target-global' : `target-${nodeID}`).classList.add('active-node');
            document.getElementById('target-tag').innerText = nodeID.toUpperCase();
            renderMessages();
        }

        function send() {
            const text = document.getElementById('inp').value.trim();
            if(!text) return;
            const payload = { sender: me, packet: text, stamp: new Date().toLocaleTimeString() };
            if(currentTarget === 'global') {
                database.ref('global_dispatches').push(payload);
            } else {
                const path = [me, currentTarget].sort().join('_id_');
                database.ref('private_tunnels/' + path).push(payload);
            }
            document.getElementById('inp').value = '';
        }

        function renderMessages() {
            const box = document.getElementById('box');
            box.innerHTML = '';
            const path = currentTarget === 'global' ? 'global_dispatches' : 'private_tunnels/' + [me, currentTarget].sort().join('_id_');
            database.ref(path).on('value', (snap) => {
                box.innerHTML = '';
                const data = snap.val();
                if(!data) return;
                Object.keys(data).forEach(key => {
                    const node = data[key];
                    const bubble = document.createElement('div');
                    bubble.className = 'msg-bubble' + (node.sender === me ? ' self' : '') + (currentTarget !== 'global' ? ' private-payload' : '');
                    bubble.innerHTML = `<div style="font-size:0.8rem; opacity:0.6;">${node.sender.toUpperCase()} &bull; ${node.stamp}</div><div>${node.packet}</div>`;
                    box.appendChild(bubble);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
        renderMessages();
    </script>
</body>
</html>
