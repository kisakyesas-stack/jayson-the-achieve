        /* Tactical Communication Matrix Grid Framework */
        .grid-container { display: grid; grid-template-columns: 250px 1fr; width: 100%; border: 2px solid var(--matrix-green); background: var(--panel-bg); min-height: 500px; }
        
        /* Node Selection Matrix Sidebar */
        .channels-sidebar { border-right: 2px solid var(--matrix-green); background: #000; display: flex; flex-direction: column; overflow-y: auto; padding: 10px; gap: 5px; }
        .channel-header { font-size: 0.9rem; padding: 5px; border-bottom: 1px dashed var(--matrix-green); margin-bottom: 8px; opacity: 0.7; }
        .channel-btn { background: transparent; border: 1px solid transparent; color: var(--matrix-green); padding: 8px; text-align: left; cursor: pointer; font-size: 1rem; width: 100%; }
        .channel-btn:hover, .channel-btn.active-node { background: var(--dark-green); border-color: var(--matrix-green); font-weight: bold; box-shadow: 0 0 8px rgba(0, 255, 65, 0.4); }
        .channel-btn.global-node { border: 1px solid #00fff0; color: #00fff0; margin-bottom: 10px; text-align: center; }
        .channel-btn.global-node:hover, .channel-btn.global-node.active-node { background: rgba(0, 255, 240, 0.2); color: #00fff0; font-weight: bold; }
        
        /* Central Workspace Control Console */
        .workspace-panel { display: flex; flex-direction: column; padding: 20px; background: rgba(0,0,0,0.4); }
        .chat-area { background: #000; border: 1px solid var(--matrix-green); flex: 1; overflow-y: auto; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; min-height: 350px; }
        .msg-bubble { background: rgba(0, 59, 0, 0.4); border-left: 3px solid var(--matrix-green); padding: 8px 12px; max-width: 85%; align-self: flex-start; }
        .msg-bubble.self { align-self: flex-end; border-left: none; border-right: 3px solid var(--matrix-green); background: rgba(0, 100, 0, 0.2); }
        .msg-bubble.private-payload { border-left-color: #ff9900; background: rgba(139, 92, 26, 0.15); }
        .msg-bubble.private-payload.self { border-right-color: #ff9900; background: rgba(139, 92, 26, 0.25); }
        
        .terminal-input { width: 100%; background: #000; border: 1px solid var(--matrix-green); padding: 10px; color: var(--matrix-green); font-size: 1rem; }
        .terminal-btn { background: var(--dark-green); color: var(--matrix-green); border: 2px solid var(--matrix-green); padding: 10px 20px; cursor: pointer; font-size: 1rem; }
        .terminal-btn:hover { background: var(--matrix-green); color: #000; font-weight: bold; }
        footer { margin-top: 30px; border-top: 2px dashed var(--matrix-green); padding: 15px; text-align: center; background: var(--panel-bg); }

            currentActiveTargetNode = nodeTargetID;

            document.getElementById(`target-${nodeTargetID}`).classList.add('active-node');
            
            document.getElementById('target-tag').innerText = nodeTargetID.toUpperCase();
            document.getElementById('target-tag').style.color = nodeTargetID === 'global' ? '#00fff0' : '#ff9900';
            
            renderMatrixStreams();
        }
