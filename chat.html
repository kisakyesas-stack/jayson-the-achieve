<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayson the Achieve - Cloud Network</title>
    <link rel="preconnect" href="https://googleapis.com"><link rel="preconnect" href="https://gstatic.com" crossorigin><link href="https://googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root { --matrix-green: #00ff41; --dark-green: #003b00; --terminal-bg: #0d0d0d; --panel-bg: rgba(16, 28, 16, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body, html { background-color: var(--terminal-bg); color: var(--matrix-green); min-height: 100vh; display: flex; flex-direction: column; }
        header { border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 15px; margin: 20px; text-align: center; }
        .grid-container { display: grid; grid-template-columns: 250px 1fr; width: 100%; border: 2px solid var(--matrix-green); background: var(--panel-bg); min-height: 500px; flex: 1; max-width: 1200px; margin: 0 auto; width: 100%; }
        .sidebar { border-right: 2px solid var(--matrix-green); background: #000; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 5px; }
        .channel-btn { background: transparent; border: 1px solid transparent; color: var(--matrix-green); padding: 8px; text-align: left; cursor: pointer; font-size: 1rem; width: 100%; }
        .channel-btn.active { background: var(--dark-green); border-color: var(--matrix-green); font-weight: bold; }
        .chat-panel { display: flex; flex-direction: column; padding: 20px; flex: 1; }
        .chat-area { background: #000; border: 1px solid var(--matrix-green); flex: 1; overflow-y: auto; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { background: rgba(0, 59, 0, 0.4); border-left: 3px solid var(--matrix-green); padding: 8px 12px; max-width: 85%; align-self: flex-start; }
        .msg-bubble.self { align-self: flex-end; border-left: none; border-right: 3px solid var(--matrix-green); }
        .terminal-input { width: 100%; background: #000; border: 1px solid var(--matrix-green); padding: 10px; color: var(--matrix-green); }
    </style>
</head>
<body>
    <header>
        <div style="font-size: 2rem;">[ JAYSON THE ACHIEVE GLOBAL MATRIX ]</div>
        <nav style="display:flex; justify-content:center; gap:20px; margin-top:15px;">
            <a href="./chat.html" style="color:var(--matrix-green); text-decoration:none; border:1px solid; padding:8px 16px;">HOME</a>
            <a href="./locate.html" style="color:var(--matrix-green); text-decoration:none; border:1px solid; padding:8px 16px;">LOCATE</a>
            <a href="#" onclick="localStorage.clear(); window.location.href='./index.html';" style="color:#ff3333; text-decoration:none; border:1px solid; padding:8px 16px;">DISCONNECT</a>
        </nav>
    </header>
    <main class="grid-container">
        <div class="sidebar">
            <button class="channel-btn active" onclick="selectNode('global')">GLOBAL MAIN GRID</button>
            <div id="nodes-list"></div>
        </div>
        <div class="chat-panel">
            <div style="margin-bottom:15px;">OP: <span id="u-tag" style="color:#00fff0;"></span></div>
            <div class="chat-area" id="box"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="inp" class="terminal-input" placeholder="Inject packet..." onkeydown="if(event.key==='Enter') send()">
                <button onclick="send()" style="background:var(--dark-green); color:var(--matrix-green); border:2px solid; padding:10px 20px; cursor:pointer;">TRANSMIT</button>
            </div>
        </div>
    </main>
    <script>
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://jayson-the-achieve-96582-default-rtdb.firebaseio.com",
            projectId: "jayson-the-achieve-96582",
            storageBucket: "jayson-the-achieve-96582.firebasestorage.app",
            messagingSenderId: "682004007077",
            appId: "1:682004007077:web:65422df8a73802ec33a54c"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const me = localStorage.getItem('jayson_session_user') || 'ANON';
        document.getElementById('u-tag').innerText = me.toUpperCase();
        let currentTarget = 'global';

        function selectNode(id) {
            currentTarget = id;
            document.querySelectorAll('.channel-btn').forEach(b => b.classList.remove('active'));
            render();
        }

        function send() {
            const val = document.getElementById('inp').value.trim();
            if(!val) return;
            const path = currentTarget === 'global' ? 'global_dispatches' : 'private/' + [me, currentTarget].sort().join('_');
            database.ref(path).push({ s: me, b: val, t: new Date().toLocaleTimeString() });
            document.getElementById('inp').value = '';
        }

        function render() {
            const box = document.getElementById('box');
            const path = currentTarget === 'global' ? 'global_dispatches' : 'private/' + [me, currentTarget].sort().join('_');
            database.ref(path).on('value', snap => {
                box.innerHTML = '';
                const data = snap.val();
                if(!data) return;
                Object.keys(data).forEach(k => {
                    const n = data[k];
                    const d = document.createElement('div');
                    d.className = 'msg-bubble' + (n.s === me ? ' self' : '');
                    d.innerHTML = `<div style="font-size:0.8rem; opacity:0.6;">${n.s.toUpperCase()} - ${n.t}</div><div>${n.b}</div>`;
                    box.appendChild(d);
                });
                box.scrollTop = box.scrollHeight;
            });
        }
        render();
    </script>
</body>
</html>
