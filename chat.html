<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayson the Achieve - Comms Network</title>
    <link rel="preconnect" href="https://googleapis.com"><link rel="preconnect" href="https://gstatic.com" crossorigin><link href="https://googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    <style>
        :root { --neon: #00ff66; --bg: #030604; --panel: rgba(10, 20, 13, 0.9); --glow: 0 0 15px rgba(0, 255, 102, 0.2); --orange: #ff9900; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body, html { background-color: var(--bg); color: var(--neon); min-height: 100vh; display: flex; flex-direction: column; }
        header { border: 2px solid var(--neon); background: var(--panel); padding: 15px; margin: 20px; text-align: center; box-shadow: var(--glow); }
        .nav { color: var(--neon); border: 1px solid var(--neon); padding: 8px 16px; text-decoration: none; margin: 0 10px; font-weight: bold; background: transparent; cursor: pointer; display: inline-block; }
        .nav.active, .nav:hover { background: var(--neon); color: #000; box-shadow: 0 0 10px var(--neon); }
        .main { flex: 1; display: flex; padding: 0 20px 20px 20px; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%; }
        .grid { display: grid; grid-template-columns: 240px 1fr; width: 100%; border: 2px solid var(--neon); background: var(--panel); box-shadow: var(--glow); }
        .sidebar { border-right: 2px solid var(--neon); background: rgba(0,5,2,0.6); display: flex; flex-direction: column; overflow-y: auto; padding: 15px; gap: 8px; }
        .lbl { font-size: 0.8rem; letter-spacing: 1px; opacity: 0.6; padding-bottom: 5px; border-bottom: 1px dashed var(--neon); margin-bottom: 5px; text-transform: uppercase; }
        .sel { background: transparent; border: 1px solid transparent; color: var(--neon); padding: 10px; text-align: left; cursor: pointer; font-size: 0.95rem; width: 100%; }
        .sel:hover, .sel.act { background: rgba(0, 40, 15, 0.5); border-color: var(--neon); font-weight: bold; }
        .sel.glob { border: 1px dashed #00fff0; color: #00fff0; text-align: center; margin-bottom: 15px; }
        .sel.glob.act { background: rgba(0, 255, 240, 0.15); }
        .pane { display: flex; flex-direction: column; padding: 25px; background: rgba(0,0,0,0.3); }
        .bar { display: flex; justify-content: space-between; font-size: 1rem; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px dashed rgba(0,255,102,0.3); }
        .screen { background: #000; border: 1px solid var(--neon); flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; min-height: 400px; }
        .pkt { background: rgba(0, 30, 10, 0.3); border-left: 3px solid var(--neon); padding: 10px; max-width: 80%; align-self: flex-start; }
        .pkt.me { align-self: flex-end; border-left: none; border-right: 3px solid var(--neon); background: rgba(0, 60, 20, 0.2); }
        .pkt.priv { border-color: var(--orange); background: rgba(51, 31, 0, 0.3); }
        .meta { font-size: 0.75rem; opacity: 0.6; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 20px; }
        .inp { width: 100%; background: #000; border: 1px solid var(--neon); padding: 14px; color: var(--neon); font-size: 1.1rem; outline: none; }
        .tx-btn { background: rgba(0, 40, 15, 0.6); color: var(--neon); border: 2px solid var(--neon); padding: 0 30px; cursor: pointer; font-weight: bold; }
        .tx-btn:hover { background: var(--neon); color: #000; }
        footer { border-top: 1px dashed var(--neon); padding: 15px; text-align: center; background: #000; margin-top: auto; }
    </style>
    <script>if (localStorage.getItem('j_auth') !== 'true') { window.location.href = './index.html'; }</script>
</head>
<body>
    <header>
        <div style="font-family:'Orbitron', sans-serif; font-size: 2rem; font-weight:700; letter-spacing:2px; text-shadow:0 0 10px var(--neon);">[ JAYSON THE ACHIEVE INFRASTRUCTURE ]</div>
        <nav style="margin-top: 12px;"><a href="./chat.html" class="nav active">Comms</a><a href="./locate.html" class="nav">Radar</a><a href="#" onclick="localStorage.clear(); window.location.href='./index.html';" class="nav" style="border-color:#ff2222; color:#ff2222;">Disconnect</a></nav>
    </header>
    <main class="main">
        <div class="grid">
            <div class="sidebar">
                <div class="lbl">Main Corridor</div>
                <button class="sel glob act" id="node-global" onclick="swap('global')">GLOBAL GRID</button>
                <div class="lbl">Private Matrix</div>
                <div id="dir"></div>
            </div>
            <div class="pane">
                <div class="bar">
                    <div>OP: <span id="my-id" style="color:#00fff0; font-weight:bold;"></span></div>
                    <div>CHANNEL: <span id="tgt-id" style="color:#00fff0; font-weight:bold;">GLOBAL GRID</span></div>
                </div>
                <div class="screen" id="scroller"></div>
                <div style="display:flex; gap:15px; margin-top:20px;">
                    <input type="text" id="msg" class="inp" placeholder="Type data packet..." onkeydown="if(event.key==='Enter') tx()">
                    <button class="tx-btn" onclick="tx()">TRANSMIT</button>
                </div>
            </div>
        </div>
    </main>
    <footer>SYSTEM DESIGN: Jayson the Achieve &bull; created by Twine Jayson Prince</footer>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyAuk5if70H5DGkRuV2vTefUZd4JINxdunE", authDomain: "://firebaseapp.com", databaseURL: "https://firebaseio.com", projectId: "jayson-the-achieve-96582", storageBucket: "jayson-the-achieve-96582.firebasestorage.app", messagingSenderId: "682004007077", appId: "1:682004007077:web:65422df8a73802ec33a54c" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const me = localStorage.getItem('j_user') || 'ANON'; document.getElementById('my-id').innerText = me.toUpperCase();
        let tgt = 'global'; let cache = null; const dir = document.getElementById('dir');
        for(let i=1; i<=20; i++) {
            const op = 'operator' + (i < 10 ? '0' + i : i); if(op === me) continue;
            const b = document.createElement('button'); b.className = 'sel'; b.id = `node-${op}`; b.innerText = `>> ${op.toUpperCase()}`; b.onclick = () => swap(op); dir.appendChild(b);
        }
        function swap(id) {
            tgt = id; document.querySelectorAll('.sel').forEach(b => b.classList.remove('act'));
            document.getElementById(id === 'global' ? 'node-global' : `node-${id}`).classList.add('act');
            document.getElementById('tgt-id').innerText = id.toUpperCase();
            document.getElementById('tgt-id').style.color = id === 'global' ? '#00fff0' : 'var(--orange)'; load();
        }
        function tx() {
            const i = document.getElementById('msg'); const val = i.value.trim(); if(!val) return;
            const p = { sender: me, payload: val, time: new Date().toLocaleTimeString() };
            if(tgt === 'global') { db.ref('global_dispatches').push(p); } 
            else { db.ref('private_tunnels/' + [me, tgt].sort().join('_id_')).push(p); } i.value = '';
        }
        db.ref('global_dispatches').on('value', (s) => { cache = s.val(); if(tgt === 'global') load(); });
        db.ref('private_tunnels').on('value', () => { if(tgt !== 'global') load(); });
        function load() {
            const sc = document.getElementById('scroller'); sc.innerHTML = '';
            if(tgt === 'global') {
                if(!cache) return;
                Object.keys(cache).forEach(k => { const n = cache[k]; build(n.sender, n.payload, n.time, false); });
            } else {
                db.ref('private_tunnels/' + [me, tgt].sort().join('_id_')).once('value', (s) => {
                    const d = s.val(); if(!d) return;
                    Object.keys(d).forEach(k => { const n = d[k]; build(n.sender, n.payload, n.time, true); });
                });
            }
        }
        function build(s, p, t, pr) {
            const sc = document.getElementById('scroller'); const b = document.createElement('div'); const isMe = s === me;
            b.className = 'pkt' + (isMe ? ' me' : '') + (pr ? ' priv' : '');
            b.innerHTML = `<div class="meta"><span style="color:${isMe ? '#00fff0' : 'var(--neon)'}; font-weight:bold;">${s.toUpperCase()}</span><span>${t}</span></div><div>${escape(p)}</div>`;
            sc.appendChild(b); sc.scrollTop = sc.scrollHeight;
        }
        function escape(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
        load();
    </script>
</body>
</html>
