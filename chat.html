<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jayson the Achieve - Global Sync Node</title>
    <link rel="preconnect" href="https://googleapis.com"><link rel="preconnect" href="https://gstatic.com" crossorigin><link href="https://googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <!-- Core Google Firebase 8.x Live Cloud Connection CDNs -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
    
    <style>
        :root { --matrix-green: #00ff41; --dark-green: #003b00; --terminal-bg: #0d0d0d; --error-red: #ff3333; --panel-bg: rgba(16, 28, 16, 0.9); }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
        body, html { background-color: var(--terminal-bg); color: var(--matrix-green); min-height: 100vh; display: flex; flex-direction: column; }
        header { border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 15px; margin: 20px; text-align: center; }
        .nav-bar { display: flex; justify-content: center; gap: 20px; margin-top: 15px; }
        .nav-link { color: var(--matrix-green); border: 1px solid var(--matrix-green); padding: 8px 16px; text-decoration: none; }
        .nav-link.active, .nav-link:hover { background: var(--matrix-green); color: #000; }
        .main-content { flex: 1; display: flex; justify-content: center; padding: 0 20px; }
        .page-panel { width: 100%; max-width: 900px; border: 2px solid var(--matrix-green); background: var(--panel-bg); padding: 25px; display: flex; flex-direction: column; }
        .chat-area { background: #000; border: 1px solid var(--matrix-green); height: 350px; overflow-y: auto; padding: 15px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg-bubble { background: rgba(0, 59, 0, 0.4); border-left: 3px solid var(--matrix-green); padding: 8px 12px; max-width: 85%; align-self: flex-start; }
        .msg-bubble.self { align-self: flex-end; border-left: none; border-right: 3px solid var(--matrix-green); background: rgba(0, 100, 0, 0.2); }
        .terminal-input { width: 100%; background: #000; border: 1px solid var(--matrix-green); padding: 10px; color: var(--matrix-green); }
        .terminal-btn { background: var(--dark-green); color: var(--matrix-green); border: 2px solid var(--matrix-green); padding: 10px 20px; cursor: pointer; }
        footer { margin-top: 30px; border-top: 2px dashed var(--matrix-green); padding: 15px; text-align: center; background: var(--panel-bg); }
    </style>
    <script>
        if (localStorage.getItem('jayson_session_active') !== 'true') { window.location.href = 'index.html'; }
    </script>
</head>
<body>
    <header>
        <div style="font-size: 2rem;">[ JAYSON THE ACHIEVE GLOBAL LIVE TERMINAL ]</div>
        <nav class="nav-bar">
            <a href="chat.html" class="nav-link active">HOME PANEL</a>
            <a href="locate.html" class="nav-link">LOCATE RADAR</a>
            <a href="#" onclick="localStorage.clear(); window.location.href='index.html';" class="nav-link" style="border-color:var(--error-red); color:var(--error-red);">DISCONNECT</a>
        </nav>
    </header>
    <main class="main-content">
        <div class="page-panel">
            <div style="margin-bottom:15px;">ACTIVE MATRIX HANDLE: <span id="u-tag" style="font-weight:bold; color:#00fff0;"></span></div>
            <div class="chat-area" id="box"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="inp" class="terminal-input" placeholder="Inject localized data array payload to global server pipeline..." onkeydown="if(event.key==='Enter') send()">
                <button class="terminal-btn" onclick="send()">TRANSMIT</button>
            </div>
        </div>
    </main>
    <footer>SYSTEM DESIGN: Jayson the Achieve &bull; created by Twine Jayson Prince</footer>

    <script>
        // Real active configurations mapped to your Google Project Dashboard
        const firebaseConfig = {
            apiKey: "AIzaSyAuk5if70H5DGkRuV2vTefUZd4JINxdunE",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "jayson-the-achieve-96582",
            storageBucket: "jayson-the-achieve-96582.firebasestorage.app",
            messagingSenderId: "682004007077",
            appId: "1:682004007077:web:65422df8a73802ec33a54c"
        };
        
        // Boot up cloud ecosystem connection pipelines inside the correct workspace script block
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const me = localStorage.getItem('jayson_session_user') || 'ANONYMOUS';
        document.getElementById('u-tag').innerText = me.toUpperCase();

        // Push chat text data straight up into the cloud pipeline repository hub array
        function send() {
            const inputField = document.getElementById('inp'); 
            const textContent = inputField.value.trim();
            if(!textContent) return;

            database.ref('global_dispatches').push({
                operator: me,
                packet: textContent,
                stamp: new Date().toLocaleTimeString()
            });
            inputField.value = '';
        }

        // Automatic Cloud Hook: Fires instantly on all open user displays when a message hits Google
        database.ref('global_dispatches').on('value', (snapshot) => {
            const viewportConsole = document.getElementById('box');
            viewportConsole.innerHTML = '';
            const messagesArray = snapshot.val();
            
            if(!messagesArray) {
                viewportConsole.innerHTML = '<div style="margin:auto; opacity:0.4;">[ DATABASE SYNC LINK ESTABLISHED: NO GLOBAL PACKETS DETECTED ]</div>';
                return;
            }

            // Loop out incoming keys from database index
            Object.keys(messagesArray).forEach(key => {
                const node = messagesArray[key];
                const bubbleElement = document.createElement('div');
                const validationCheck = node.operator === me;
                
                bubbleElement.className = 'msg-bubble' + (validationCheck ? ' self' : '');
                bubbleElement.innerHTML = `
                    <div style="font-size:0.8rem; opacity:0.6;">
                        <span style="color:${validationCheck ? '#00fff0' : 'var(--matrix-green)'}; font-weight:bold;">${node.operator.toUpperCase()}</span> &bull; ${node.stamp}
                    </div>
                    <div style="word-break:break-word; margin-top:4px;">${escapeHTML(node.packet)}</div>
                `;
                viewportConsole.appendChild(bubbleElement);
            });
            viewportConsole.scrollTop = viewportConsole.scrollHeight;
        });

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
